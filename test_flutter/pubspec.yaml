name: greeting_app
description: A single-user Material 3 military CRM integration preview.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.0'

dependencies:
  flutter:
    sdk: flutter
  file_selector: ^1.1.0
  url_launcher: ^6.3.1
  sqlite3: ^3.8.0
  path_provider: ^2.1.5
  path: ^1.9.1
  flutter_quill: ^11.6.0
  ffi: ^2.2.0
  win32: ^6.4.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  flutter_secure_storage: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/schema_v1.sql
    - assets/steel_wings_crm_logo.png

hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc
